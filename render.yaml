# Render設定（非推奨: OCI移行済み）
# このファイルはRenderで運用していた時の設定です
# 現在はOCI VM.Standard.E2.1.Micro で稼働しています
services:
  - type: web
    name: withlive-monitor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DAYS_AHEAD
        value: 2
